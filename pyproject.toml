[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-reviewer"
version = "0.1.0"
description = "Config-driven agentic reviewer for local Git changes and history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.9.0",
  "openai>=1.0.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
litellm = [
  "openai-agents[litellm]>=0.9.0",
]

[project.scripts]
github-reviewer = "github_reviewer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
